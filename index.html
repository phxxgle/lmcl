<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Glassmorphism Effect</title>
  <style>
    /* Reset & Cấu hình cơ bản */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Nền Gradient đa sắc rực rỡ để hiệu ứng kính nổi bật nhất */
      background: radial-gradient(circle at 20% 20%, #ff758c 0%, transparent 40%),
                  radial-gradient(circle at 80% 80%, #4facfe 0%, transparent 40%),
                  radial-gradient(circle at 50% 50%, #00f2fe 0%, transparent 50%),
                  linear-gradient(135deg, #111827 0%, #1f2937 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Khung thẻ hiệu ứng Glassmorphism */
    .iphone-glass-card {
      width: 340px;
      padding: 28px;
      
      /* 1. Nền trắng bán trong suốt */
      background: rgba(255, 255, 255, 0.18);
      
      /* 2. Hiệu ứng làm mờ + tăng độ rực màu hậu cảnh (đặc trưng iOS) */
      -webkit-backdrop-filter: blur(25px) saturate(190%);
      backdrop-filter: blur(25px) saturate(190%);
      
      /* 3. Bo góc lớn mềm mại */
      border-radius: 32px;
      
      /* 4. Viền siêu mỏng bắt sáng cạnh kính */
      border: 1px solid rgba(255, 255, 255, 0.35);
      
      /* 5. Đổ bóng diện rộng, mềm mại */
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25),
                  inset 0 1px 0 rgba(255, 255, 255, 0.4);

      color: #ffffff;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Hiệu ứng rê chuột nhẹ nhàng */
    .iphone-glass-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.3),
                  inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    /* Nội dung bên trong thẻ */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .card-description {
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 24px;
    }

    /* Nút bấm chuẩn iOS Glass */
    .glass-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .glass-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Thẻ kính iPhone -->
  <div class="iphone-glass-card">
    <div class="card-header">
      <span class="badge">iOS 18 Glass</span>
      <span style="opacity: 0.7; font-size: 12px;">Vừa xong</span>
    </div>
    
    <h2 class="card-title">Glassmorphism</h2>
    <p class="card-description">
      Giao diện kính mờ mượt mà với hiệu ứng blur, đổ bóng nhẹ và đường viền phản chiếu ánh sáng.
    </p>

    <button class="glass-btn">Khám phá ngay</button>
  </div>

</body>
</html>
