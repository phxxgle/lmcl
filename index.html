<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Standings Layout</title>
  <style>
    :root {
      --chalk-dim: #888888;
      --line: #dddddd;
    }

    /* 1. CSS cập nhật cho bảng Standings */
    table.standings {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      margin-top: 4px;
      table-layout: fixed;
    }
    
    table.standings thead th {
      text-align: center;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--chalk-dim);
      padding: 0 2px 8px;
      border-bottom: 1px solid var(--line);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    table.standings tbody td {
      text-align: center;
      padding: 8px 2px;
      border-bottom: 1px solid var(--line);
      font-family: 'Space Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    /* Đã xóa bỏ hoàn toàn các đường kẻ cột (border-right) */

    table.standings tbody td:nth-child(2) {
      text-align: left;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      padding-left: 6px;
      padding-right: 6px;
    }
    
    table.standings thead th:nth-child(2) {
      text-align: center;
    }

    /* Cấu hình chiều rộng cho bảng Overall */
    table.standings-overall th:nth-child(1),
    table.standings-overall td:nth-child(1) { width: 15%; }
    table.standings-overall th:nth-child(2),
    table.standings-overall td:nth-child(2) { width: 55%; } /* Mở rộng tối đa cho tên */
    table.standings-overall th:nth-child(3),
    table.standings-overall td:nth-child(3) { width: 15%; }
    table.standings-overall th:nth-child(4),
    table.standings-overall td:nth-child(4) { width: 15%; }

    table.standings tbody tr:last-child td { border-bottom: none; }

    /* Cấu hình chiều rộng cho bảng Full (Nam/Nữ chi tiết) */
    table.standings-full th:nth-child(1),
    table.standings-full td:nth-child(1) { width: 10%; }
    table.standings-full th:nth-child(2),
    table.standings-full td:nth-child(2) { width: 40%; } /* Mở rộng không gian hiển thị tên */
    table.standings-full th:nth-child(3),
    table.standings-full td:nth-child(3),
    table.standings-full th:nth-child(4),
    table.standings-full td:nth-child(4),
    table.standings-full th:nth-child(5),
    table.standings-full td:nth-child(5),
    table.standings-full th:nth-child(6),
    table.standings-full td:nth-child(6),
    table.standings-full th:nth-child(7),
    table.standings-full td:nth-child(7),
    table.standings-full th:nth-child(8),
    table.standings-full td:nth-child(8) { width: 10%; }
  </style>
</head>
<body>

  <!-- Ví dụ cấu trúc Bảng Overall -->
  <h3>Bảng Tổng Kết (Overall Standings)</h3>
  <table class="standings standings-overall">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Player</th>
        <th>Points</th>
        <th>Form</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>Nguyễn Văn A (Vận động viên)</td>
        <td>120</td>
        <td>W-W-W</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Trần Thị B (Vận động viên)</td>
        <td>110</td>
        <td>W-L-W</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
