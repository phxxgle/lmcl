<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Tối ưu hiển thị responsive & thanh trạng thái trên điện thoại -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Đồng bộ màu cột sóng, giờ trên Android (Chrome, Edge...) -->
    <meta name="theme-color" content="#0f172a">
    
    <!-- Đồng bộ thanh trạng thái trên iOS (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>LMCL Rankings – August 2026</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --error-color: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .score-inputs {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .separator {
            font-weight: bold;
            color: var(--accent-color);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>LMCL Rankings – August 2026</h1>

    <div class="container">
        <form id="scoreForm">
            <div class="form-group">
                <label>Tỷ số trận đấu</label>
                <div class="score-inputs">
                    <input type="number" id="score1" placeholder="Đội A" min="0" required>
                    <span class="separator">-</span>
                    <input type="number" id="score2" placeholder="Đội B" min="0" required>
                </div>
                <div id="errorMessage" class="error-message">Tỷ số không hợp lệ. Khoảng cách điểm phải từ 2 điểm trở lên.</div>
            </div>

            <button type="submit" class="btn-submit">Ghi nhận tỷ số</button>
        </form>
    </div>

    <script>
        // Cấu hình Firebase (Thay thế thông tin của bạn vào đây)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Khởi tạo Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const form = document.getElementById('scoreForm');
        const score1Input = document.getElementById('score1');
        const score2Input = document.getElementById('score2');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const score1 = parseInt(score1Input.value, 10);
            const score2 = parseInt(score2Input.value, 10);
            const diff = Math.abs(score1 - score2);

            // Kiểm tra quy tắc: Hiệu số điểm phải >= 2
            if (diff < 2) {
                errorMessage.style.display = 'block';
                return;
            }

            // Hợp lệ -> Ẩn thông báo lỗi & Xử lý lưu dữ liệu
            errorMessage.style.display = 'none';

            /*
            db.collection("matches").add({
                score1: score1,
                score2: score2,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("Đã cập nhật tỷ số thành công!");
                form.reset();
            })
            .catch((error) => {
                console.error("Lỗi khi lưu dữ liệu: ", error);
            });
            */
            
            alert("Tỷ số hợp lệ! (Đã sẵn sàng gửi lên Firebase)");
        });
    </script>
</body>
</html>
