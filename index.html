<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Directory - Members</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================
       GLOBAL VARIABLES & THEME SETUP
       ========================================= */
    :root {
      /* Bảng màu và hiệu ứng Glassmorphism */
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-bg-hover: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-border-light: rgba(255, 255, 255, 0.25);
      --glass-blur: 12px;
      --chalk: #f8f9fa;
      --chalk-dim: #adb5bd;
      --bg-dark: #0f172a;
    }

    body {
      margin: 0;
      padding: 24px;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
      color: var(--chalk);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    h2 {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
      font-size: 24px;
      margin-top: 32px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 8px;
    }

    /* =========================================
       PLAYER DIRECTORY (MEMBERS) CSS
       ========================================= */
    .members-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    
    .player-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      position: relative;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .player-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
      border-color: var(--glass-border-light);
      background: var(--glass-bg-hover);
    }

    .player-rank-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--chalk);
      border: 1px solid var(--glass-border);
    }

    /* Highlight cho Top 3 */
    .player-card.rank-1 .player-rank-badge {
      background: linear-gradient(135deg, #FFE259 0%, #FFA751 100%);
      color: #4A2E00;
      border: none;
      box-shadow: 0 0 10px rgba(255, 209, 102, 0.5);
    }
    .player-card.rank-2 .player-rank-badge {
      background: linear-gradient(135deg, #E2E8F0 0%, #94A3B8 100%);
      color: #0F172A;
      border: none;
    }
    .player-card.rank-3 .player-rank-badge {
      background: linear-gradient(135deg, #F6AD55 0%, #DD6B20 100%);
      color: #3C1500;
      border: none;
    }

    .player-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--glass-border-light);
      background: rgba(0, 0, 0, 0.3);
      margin-bottom: 12px;
      padding: 2px;
    }

    .player-name {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--chalk);
      margin: 0 0 12px;
      line-height: 1.3;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-info-list {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
      font-size: 10.5px;
      color: var(--chalk-dim);
      text-align: left;
    }

    .player-info-list li {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
    }
    
    .player-info-list li:last-child {
      border-bottom: none;
    }

    .player-info-list span:last-child {
      color: var(--chalk);
      font-weight: 600;
      text-align: right;
    }

    /* Responsive cho màn hình lớn hơn một chút (Tablet/Desktop) */
    @media (min-width: 600px) {
      .members-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media (min-width: 900px) {
      .members-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Khung chứa giao diện -->
  <div style="max-width: 1000px; margin: 0 auto;">
    <h2>Bảng Nam</h2>
    <div id="members-nam"></div>

    <h2>Bảng Nữ</h2>
    <div id="members-nu"></div>
  </div>

  <script>
    /* =========================================
       1. DỮ LIỆU MẪU (MOCK DATA)
       Thay thế phần này bằng dữ liệu thực tế của bạn
       ========================================= */
    const MEMBERS_DATA = {
      'nam': {
        'Minh Khang': { year: 1995, photo: '' },
        'Hải Đăng': { year: 1998, photo: '' },
        'Tuấn Kiệt': { year: 2000, photo: '' },
        'Quốc Bảo': { year: '—', photo: '' },
        'Hoàng Nam': { year: 1992, photo: '' }
      },
      'nu': {
        'Hương Giang': { year: 1999, photo: '' },
        'Thu Trang': { year: 2001, photo: '' },
        'Bảo Ngọc': { year: '—', photo: '' }
      }
    };

    const PREVIOUS_TOURNAMENT = {
      standings: [
        { name: 'Minh Khang' },  // Hạng 1 (Nam)
        { name: 'Hải Đăng' },    // Hạng 2 (Nam)
        { name: 'Hương Giang' }, // Hạng 3 (Nữ) - Chung bảng xếp hạng mix hoặc tách riêng tùy logic
        { name: 'Tuấn Kiệt' }    // Hạng 4 (Nam)
      ]
    };

    /* =========================================
       2. LOGIC XỬ LÝ (JAVASCRIPT)
       ========================================= */
    
    // Hàm bảo mật tránh XSS khi render chuỗi
    function escapeHtml(unsafe) {
      if (typeof unsafe !== 'string') return unsafe;
      return unsafe
           .replace(/&/g, "&amp;")
           .replace(/</g, "&lt;")
           .replace(/>/g, "&gt;")
           .replace(/"/g, "&quot;")
           .replace(/'/g, "&#039;");
    }

    // Tính toán bảng xếp hạng
    function getPlayerRankings() {
      const standings = PREVIOUS_TOURNAMENT.standings;
      const rankMap = {};
      standings.forEach((player, index) => {
        rankMap[player.name] = index + 1;
      });
      return rankMap;
    }

    // Render giao diện Members
    function renderMembersDirectory() {
      const rankMap = getPlayerRankings();
      // Icon mặc định SVG nếu không có ảnh
      const defaultAvatar = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23adb5bd' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'%3E%3C/path%3E%3Ccircle cx='12' cy='7' r='4'%3E%3C/circle%3E%3C/svg%3E";

      ['nam', 'nu'].forEach(group => {
        const container = document.getElementById(`members-${group}`);
        if (!container) return;

        // Xử lý dữ liệu
        let players = Object.keys(MEMBERS_DATA[group]).map(name => {
          return {
            name: name,
            data: MEMBERS_DATA[group][name],
            rank: rankMap[name] || 999
          };
        });

        // Sắp xếp theo hạng (nhỏ đến lớn)
        players.sort((a, b) => a.rank - b.rank);

        let html = '<div class="members-grid">';
        
        players.forEach(p => {
          const rankDisplay = p.rank === 999 ? 'UNR' : `#${p.rank}`;
          const rankClass = p.rank <= 3 ? `rank-${p.rank}` : '';
          const avatarSrc = p.data.photo ? p.data.photo : defaultAvatar;
          const dob = p.data.year !== "—" ? p.data.year : "N/A";
          const nation = "Việt Nam";

          html += `
            <div class="player-card ${rankClass}">
              <div class="player-rank-badge">${rankDisplay}</div>
              <img src="${avatarSrc}" alt="${p.name}" class="player-avatar">
              <h3 class="player-name">${escapeHtml(p.name)}</h3>
              
              <ul class="player-info-list">
                <li>
                  <span>DOB</span>
                  <span>${escapeHtml(dob.toString())}</span>
                </li>
                <li>
                  <span>Nation</span>
                  <span>${nation}</span>
                </li>
              </ul>
            </div>
          `;
        });

        html += '</div>';
        container.innerHTML = html;
      });
    }

    /* =========================================
       3. KHỞI CHẠY ỨNG DỤNG
       ========================================= */
    document.addEventListener("DOMContentLoaded", () => {
        renderMembersDirectory();
    });
  </script>
</body>
</html>
