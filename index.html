<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMCL Allstars Intro Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@700;800&family=Inter:wght@600;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-color: #081831;
    --text-gold: #FFC72C;
    --text-white: #F5F7FA;
    --line-color: rgba(255, 255, 255, 0.4);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-color);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Tomorrow', 'Inter', sans-serif;
  }

  /* Khung chứa toàn bộ Intro - Tự động căn giữa màn hình */
  .intro-container {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 1. LOGO STYLES & ANIMATION */
  .logo-box {
    width: 95px;
    height: 95px;
    background: linear-gradient(135deg, #FFC72C 0%, #EC4899 100%);
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    z-index: 2;
    flex-shrink: 0;

    /* Animation: Hiện ở trung tâm -> Trượt mượt */
    animation: 
      logoAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards,
      logoMoveLeft 0.8s cubic-bezier(0.65, 0, 0.35, 1) 1.2s forwards;
  }

  .logo-text {
    font-size: 26px;
    font-weight: 800;
    color: var(--bg-color);
    letter-spacing: -1px;
  }

  /* 2. THANH GẠCH ĐỨNG "|" STYLES & ANIMATION */
  .divider {
    width: 3px;
    height: 80px;
    background-color: var(--line-color);
    margin: 0 20px;
    border-radius: 2px;
    opacity: 0;
    transform: scaleY(0);
    transform-origin: center;

    /* Animation: Nở ra từ giữa theo chiều dọc */
    animation: dividerAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards;
  }

  /* 3. NỘI DUNG CHỮ STYLES & ANIMATION */
  .text-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    opacity: 0;
    transform: translateX(-15px);
    white-space: nowrap;

    /* Animation: Trượt ra từ thanh gạch đứng */
    animation: textAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) 2.1s forwards;
  }

  .title-main {
    font-size: 24px;
    font-weight: 800;
    color: var(--text-gold);
    line-height: 1.1;
    letter-spacing: 1.5px;
  }

  .title-sub {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-white);
    line-height: 1.2;
    letter-spacing: 2px;
  }

  /* KHOẢNG BADGE "AUGUST 2026" CÓ KHUNG TRẮNG */
  .date-badge {
    display: inline-block;
    background-color: #FFFFFF; /* Khung màu trắng */
    color: var(--bg-color);    /* Chữ trùng màu background (#081831) */
    font-family: 'Inter', sans-serif;
    font-size: 9px;            /* Size chữ bé hơn */
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 3px 8px;          /* Đệm viền xung quanh chữ */
    border-radius: 4px;        /* Bo góc nhẹ cho khung */
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* KEYFRAMES */
  @keyframes logoAppear {
    0% {
      opacity: 0;
      transform: scale(0.5);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  @keyframes logoMoveLeft {
    0% {
      transform: translateX(0);
    }
    100% {
      transform: translateX(0); 
    }
  }

  @keyframes dividerAppear {
    0% {
      opacity: 0;
      transform: scaleY(0);
    }
    100% {
      opacity: 1;
      transform: scaleY(1);
    }
  }

  @keyframes textAppear {
    0% {
      opacity: 0;
      transform: translateX(-15px);
    }
    100% {
      opacity: 1;
      transform: translateX(0);
    }
  }
</style>
</head>
<body>

  <div class="intro-container">
    <!-- Logo -->
    <div class="logo-box">
      <span class="logo-text">LMCL</span>
    </div>

    <!-- Thanh gạch đứng ở giữa -->
    <div class="divider"></div>

    <!-- Khối văn bản -->
    <div class="text-content">
      <div class="title-main">LMCL</div>
      <div class="title-sub">ALLSTARS</div>
      <div class="title-sub">RANKINGS</div>
      <div class="date-badge">AUGUST 2026</div>
    </div>
  </div>

</body>
</html>
